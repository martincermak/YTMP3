name: Build installer
on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python fetch_deps.py
      - run: python -m PyInstaller --onefile --noconsole --name YTMP3 --collect-all customtkinter --hidden-import PIL._tkinter_finder app.py
      - run: choco install innosetup -y --no-progress
      - run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: YTMP3-Setup
          path: installer/YTMP3-Setup.exe

  e2e:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: YTMP3-Setup
          path: setup
      - name: Install silently
        shell: pwsh
        run: |
          Start-Process -FilePath "setup\YTMP3-Setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\YTMP3' -Wait
          Get-ChildItem C:\YTMP3 | Format-Table Name, Length
      - name: E2E - lokální zdroj (instalátor, závislosti, ffmpeg, MP3)
        run: python tests/e2e_test.py C:\YTMP3\YTMP3.exe --source local
      - name: E2E - YouTube
        shell: pwsh
        run: |
          python tests/e2e_test.py C:\YTMP3\YTMP3.exe --source youtube
          if ($LASTEXITCODE -eq 2) {
            Write-Host "::warning title=YouTube E2E nerozhodnuto::YouTube blokuje IP adresu runneru (bot check)."
            exit 0
          }
          exit $LASTEXITCODE

  release:
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YTMP3-Setup
          path: installer
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" installer/YTMP3-Setup.exe --repo "${{ github.repository }}" --title "YT MP3 ${{ github.ref_name }}" --generate-notes
